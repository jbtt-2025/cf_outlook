name: Build & Release dist.zip

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (留空则根据版本号与运行次数自动生成)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Release ZIP
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm test

      - name: 构建全栈生产产物并打包 (dist.zip)
        run: |
          npm run build:zip
          sha256sum dist.zip > dist.zip.sha256
          echo "ZIP SHA256: $(cat dist.zip.sha256)"

      - name: 计算 Release 版本号与标题
        id: release_meta
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            NAME="Release $TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            NAME="Release $TAG"
          else
            VERSION=$(node -p "require('./package.json').version || '1.0.0'")
            TAG="v${VERSION}.${{ github.run_number }}"
            NAME="Release $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: 发布 GitHub Release 并上传 dist.zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist.zip
            dist.zip.sha256
          body: |
            ### 📦 Cloudflare Pages 全栈极速部署包

            本 Release 包含一键全栈部署包 **`dist.zip`**（已内置前端三栏工作台与 `_worker.js` 边缘 Functions 网关）。
            支持多用户权限隔离、防穷举动态验证码、服务端 D1 数据库持久化与 Refresh Token 自动滚动回写。

            #### 🚀 零门槛部署教程 (1 分钟极速上线)：
            1. **准备 D1 数据库**：登录 [Cloudflare 控制台](https://dash.cloudflare.com/) -> 左侧 **D1 SQL 数据库** -> 点击创建（名称例如 `cf-outlook-db`）；
            2. **上传部署站点**：左侧点击 **Workers 和 Pages** -> **创建应用程序** -> **Pages** -> **直接上传 (Direct Upload)**，输入项目名称（如 `cf-outlook`），上传下载的 **`dist.zip`** 并点击 **部署站点**；
            3. **绑定数据库**：部署完成后进入该 Pages 项目 -> **设置 (Settings)** -> **函数 (Functions)** -> **D1 数据库绑定** -> 添加绑定名 **`DB`**（严格大写）指向 `cf-outlook-db`，保存后重试部署一次即可；
            4. **创建超级管理员**：打开分配的 `*.pages.dev` 专属域名，系统自动弹出初始化向导，首个注册用户即为超级管理员！
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
