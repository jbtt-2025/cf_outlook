name: Build & Release

on:
  push:
    branches:
      - main
      - go_version
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-Arch Binaries & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Frontend SPA
        run: |
          npm ci || npm install
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Go Unit Tests
        run: |
          go test -v ./...

      - name: Cross-Compile Standalone Binaries (Pure Go CGO_ENABLED=0)
        run: |
          mkdir -p release_dist

          # 1. Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o release_dist/cf_outlook-linux-amd64 .
          tar -czvf release_dist/cf_outlook-linux-amd64.tar.gz -C release_dist cf_outlook-linux-amd64
          rm release_dist/cf_outlook-linux-amd64

          # 2. Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o release_dist/cf_outlook-linux-arm64 .
          tar -czvf release_dist/cf_outlook-linux-arm64.tar.gz -C release_dist cf_outlook-linux-arm64
          rm release_dist/cf_outlook-linux-arm64

          # 3. Windows amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o release_dist/cf_outlook-windows-amd64.exe .
          cd release_dist && zip cf_outlook-windows-amd64.zip cf_outlook-windows-amd64.exe && rm cf_outlook-windows-amd64.exe && cd ..

          # 4. macOS Apple Silicon (arm64)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o release_dist/cf_outlook-darwin-arm64 .
          tar -czvf release_dist/cf_outlook-darwin-arm64.tar.gz -C release_dist cf_outlook-darwin-arm64
          rm release_dist/cf_outlook-darwin-arm64

          # 5. macOS Intel (amd64)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o release_dist/cf_outlook-darwin-amd64 .
          tar -czvf release_dist/cf_outlook-darwin-amd64.tar.gz -C release_dist cf_outlook-darwin-amd64
          rm release_dist/cf_outlook-darwin-amd64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cf_outlook-binaries
          path: release_dist/*

      - name: Publish GitHub Release (Tag or Rolling Push)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/go_version'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Automatic Build' }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: release_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
